name: Continuous documentation delivery

on:
  push:
    branches: [development, test, staging, production, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REPOSITORY_CLASS: documentation
  SOURCE_BRANCH: ${{ github.ref_name }}
  SOURCE_SHA: ${{ github.sha }}

jobs:
  deliver:
    name: immutable-documentation-delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Restrict delivery to persistent branches
        run: |
          set -Eeuo pipefail
          case "$SOURCE_BRANCH" in development|test|staging|production|main) ;; *) exit 1 ;; esac
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact clean checkout
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate release candidate
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
          mkdir -p evidence
          python scripts/ci/validate_repository.py --root . --mode release --branch "$SOURCE_BRANCH" --repository-class "$REPOSITORY_CLASS" --evidence evidence/release-validation.json
      - name: Build deterministic source archive and manifest
        run: |
          set -Eeuo pipefail
          git archive --format=tar.gz --output=evidence/documentation-source.tar.gz HEAD
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          evidence = Path('evidence')
          source = evidence / 'documentation-source.tar.gz'
          payload = {
              'schema_version': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'branch': os.environ['SOURCE_BRANCH'],
              'source_sha': os.environ['SOURCE_SHA'],
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'repository_class': 'documentation',
              'source_archive_digest': 'sha256:' + hashlib.sha256(source.read_bytes()).hexdigest(),
              'runtime_deployment_authorized': False,
              'external_effects_authorized': False,
          }
          (evidence / 'release-manifest.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          (cd evidence && find . -maxdepth 1 -type f ! -name checksums.sha256 -print0 | sort -z | xargs -0 sha256sum > checksums.sha256 && sha256sum --check --strict checksums.sha256)
      - name: Upload immutable documentation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-${{ github.ref_name }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
